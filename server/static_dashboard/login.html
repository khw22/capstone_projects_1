<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환경지기 관제 · 관리자 로그인</title>
<style>
  :root{--bg:#0f1b2a;--card:#162538;--line:#2a3d55;--ink:#e8eef6;--mute:#8fa3ba;--accent:#4ea1ff;--bad:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 20% 10%,#1b3350 0,#0f1b2a 60%);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  .box{width:min(380px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 26px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  h1{margin:0 0 4px;font-size:20px}
  .sub{margin:0 0 20px;color:var(--mute);font-size:13px}
  label{display:block;font-size:12px;color:var(--mute);margin:12px 0 5px}
  input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:#0f1b2a;color:var(--ink);font-size:15px}
  input:focus{outline:2px solid var(--accent);border-color:transparent}
  button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#06121f;font-weight:bold;font-size:15px;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  #msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--bad)}
  .foot{margin-top:16px;font-size:11px;color:var(--mute);line-height:1.5}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <h1>🛡 환경지기 관제</h1>
  <p class="sub">CCTV 센서화 기반 환경 오염 분석 · 관리자 전용</p>
  <label for="u">아이디</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">비밀번호</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">로그인</button>
  <div id="msg" role="alert"></div>
  <div class="foot">허가된 관리자만 CCTV 영상과 이벤트를 볼 수 있습니다. 로그인 시도는 5분에 5번까지 허용됩니다.</div>
</form>
<script>
  var next = new URLSearchParams(location.search).get("next") || "/control.html";
  if (!/^\/[A-Za-z0-9_\-./]*$/.test(next) || next.indexOf("//") === 0) next = "/control.html";   // 같은 사이트 안의 경로만 허용
  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var b = document.getElementById("b"), m = document.getElementById("msg");
    b.disabled = true; m.textContent = "";
    fetch("/api/auth/login", {method: "POST", headers: {"Content-Type": "application/json"}, credentials: "same-origin",
      body: JSON.stringify({username: document.getElementById("u").value, password: document.getElementById("p").value})})
      .then(function (r) { return r.json().then(function (j) { return {ok: r.ok, j: j}; }); })
      .then(function (x) { if (x.ok) { location.href = next; } else { m.textContent = x.j.detail || "로그인에 실패했습니다."; b.disabled = false; } })
      .catch(function () { m.textContent = "서버에 연결할 수 없습니다."; b.disabled = false; });
  });
</script>
</body>
</html>
